name: Player feedback
description: Report a problem or suggest an improvement for OpenBonk.
title: "[Feedback] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenBonk! Please don't attach Steam files, save data, account details, or other private information. Reports are public.
  - type: dropdown
    id: category
    attributes:
      label: What kind of feedback is this?
      options:
        - Bug or crash
        - Controls or camera
        - Performance
        - Mods or launcher
        - Suggestion
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened or what would you like to see?
      description: Include the steps to reproduce the problem if you can.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Samsung Galaxy A73, Android 14
  - type: input
    id: version
    attributes:
      label: OpenBonk version
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or logs can help, but check them for private information before sharing.
